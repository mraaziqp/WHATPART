# Production stack at /opt/whatpart on the VPS. deploy.sh copies this file there.
# Secrets live next to it in .env (database, search, auth) and app.env (app settings); neither is in git.
name: whatpart

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports: [ "127.0.0.1:5432:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    shm_size: 256mb
    logging: *logging

  search:
    image: getmeili/meilisearch:v1.16
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meili:/meili_data
    ports: [ "127.0.0.1:7700:7700" ]
    logging: *logging

  app:
    image: whatpart-app:latest
    build:
      context: ./app
      args:
        NEXT_PUBLIC_SITE_URL: https://whatpart.africa
    restart: unless-stopped
    env_file: app.env
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      search: { condition: service_started }
    networks:
      default:
        aliases: [ whatpart-app ]
    mem_limit: 1g
    logging: *logging

  # One-off jobs: migrations, reindexing, scheduled deal refresh (see ops/whatpart.cron).
  tools:
    image: whatpart-tools:latest
    build:
      context: ./app
      target: build
    profiles: [ tools ]
    env_file: app.env
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

networks:
  default:
    name: whatpart
